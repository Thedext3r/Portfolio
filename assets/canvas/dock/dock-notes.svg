<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64">
  <defs>
    <linearGradient id="notes-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="18%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <filter id="notes-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- macOS Note Pad Squircle -->
  <rect filter="url(#notes-shadow)" x="2" y="1.5" width="20" height="21" rx="4.8" fill="url(#notes-bg)" stroke="#d97706" stroke-width="0.8"/>
  <!-- Top leather binder header -->
  <path d="M2 5.5 C2 3.3 3.5 1.5 6 1.5 L18 1.5 C20.5 1.5 22 3.3 22 5.5 L22 6 L2 6 Z" fill="#b45309"/>
  <!-- Tabler notes rule lines from universal-icons MCP -->
  <g stroke="#b45309" stroke-width="1.3" stroke-linecap="round">
    <line x1="5.5" y1="9.5" x2="18.5" y2="9.5" stroke-opacity="0.5"/>
    <line x1="5.5" y1="13" x2="18.5" y2="13" stroke-opacity="0.5"/>
    <line x1="5.5" y1="16.5" x2="18.5" y2="16.5" stroke-opacity="0.5"/>
    <line x1="5.5" y1="20" x2="13" y2="20" stroke-opacity="0.5"/>
  </g>
</svg>
