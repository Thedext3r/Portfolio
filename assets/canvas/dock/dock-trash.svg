<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64">
  <defs>
    <linearGradient id="trash-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.6" />
    </linearGradient>
    <filter id="trash-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Translucent Glass/Mesh Wastebasket matching macOS dock -->
  <g filter="url(#trash-shadow)">
    <!-- Basket Body -->
    <path d="M5.5 6.5 L7 20 C7.2 21 8 21.8 9.2 21.8 L14.8 21.8 C16 21.8 16.8 21 17 20 L18.5 6.5 Z" fill="url(#trash-metal)" stroke="#64748b" stroke-width="0.75"/>
    <!-- Top Rim -->
    <ellipse cx="12" cy="6.5" rx="6.8" ry="1.8" fill="#f8fafc" stroke="#64748b" stroke-width="0.8"/>
    <!-- Crumpled White Paper inside -->
    <path d="M8.5 6 C9 4.8 11 4.5 12 5.5 C13 4.2 15 4.8 15.5 6 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
    <!-- Mesh Vertical Struts from Tabler trash style -->
    <line x1="9" y1="8" x2="9.8" y2="19" stroke="#64748b" stroke-width="0.7" stroke-opacity="0.5"/>
    <line x1="12" y1="8.3" x2="12" y2="19.5" stroke="#64748b" stroke-width="0.7" stroke-opacity="0.5"/>
    <line x1="15" y1="8" x2="14.2" y2="19" stroke="#64748b" stroke-width="0.7" stroke-opacity="0.5"/>
  </g>
</svg>
